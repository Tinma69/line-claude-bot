<meta charset="utf-8">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    width:1600px; height:900px; background:#fff;
    font-family:"Yu Gothic UI","Hiragino Sans","Noto Sans JP",sans-serif;
    display:flex; flex-direction:column; padding:56px 64px 40px;
  }
  .eyebrow { font-size:20px; letter-spacing:.14em; color:#E8786C; font-weight:700; }
  .title { font-size:44px; font-weight:700; color:#2B2B2B; margin-top:8px; letter-spacing:.01em; }
  .sub { font-size:19px; color:#666; margin-top:10px; }
  .chart { flex:1; margin-top:8px; }
  .note { font-size:14px; color:#999; margin-top:4px; }
  .stats { display:flex; gap:14px; margin-top:6px; }
  .stat { flex:1; background:#FFF1EE; border-radius:14px; padding:16px 22px; }
  .stat .n { font-size:32px; font-weight:700; color:#E8786C; line-height:1.1; }
  .stat .l { font-size:15px; color:#2B2B2B; font-weight:700; margin-top:4px; }
</style>
